name: Update GitHub Trophy

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  trophy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate trophy
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: gAurav-0x07
          output_path: trophy-output/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit trophy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add trophy-output/trophy.svg

          git diff --cached --quiet || git commit -m "Update GitHub trophy"

          git push
